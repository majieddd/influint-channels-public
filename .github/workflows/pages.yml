# Deploy the generated knowledge-base site.
#
# The legacy "build from branch" path hung indefinitely on a publish with ~30
# nested pages, leaving a week-old site live while reporting "building". This
# workflow restores supplementary thumbnails and deploys the static output.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Recover the complete Nizar revision after the external publisher rebuilds studies.
      - name: Preserve the Nizar IRL creator playbook
        run: node .github/scripts/persist-nizar-study.mjs
      # Restore the Sam Bananas repackaging study if the publisher sweep removed it,
      # and re-insert the marker-guarded Studies/Analyses blocks into the channel page.
      - name: Preserve the Sam Bananas repackaging study
        shell: bash
        run: node .github/scripts/persist-study.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
